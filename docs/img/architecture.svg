<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Architecture on Foundry: notice PDFs go through AIP Logic and raw exports through cleaning transforms into the Ontology; decision-logic transforms compute impact, forecasts and options; a Workshop app shows them to the engineer, whose approval Action writes back to the Ontology.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B8F94"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5B1F"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#08090A"/>
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#8B8F94">
    <text x="56" y="64" fill="#FF5B1F" letter-spacing="3" font-size="16">ARCHITECTURE ON FOUNDRY</text>
    <text x="56" y="116">SOURCES</text>
    <text x="300" y="116">PIPELINES + AIP</text>
    <text x="580" y="116">ONTOLOGY</text>
    <text x="890" y="116">OPERATIONAL APP</text>
  </g>
  <line x1="56" y1="88" x2="1144" y2="88" stroke="#EDEDEA"/>

  <g font-family="'Inter Tight', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- sources -->
    <rect x="56.5" y="140.5" width="200" height="90" fill="none" stroke="#2A2D31"/>
    <text x="76" y="180" font-size="22" font-weight="600" fill="#EDEDEA">Notice PDFs</text>
    <text x="76" y="208" font-size="16" fill="#B8BBBF">Microchip, Intel</text>
    <rect x="56.5" y="300.5" width="200" height="90" fill="none" stroke="#2A2D31"/>
    <text x="76" y="340" font-size="22" font-weight="600" fill="#EDEDEA">Raw exports</text>
    <text x="76" y="368" font-size="16" fill="#B8BBBF">BOMs, stock, demand</text>

    <!-- pipelines -->
    <rect x="300.5" y="140.5" width="220" height="90" fill="none" stroke="#EDEDEA"/>
    <text x="320" y="180" font-size="22" font-weight="600" fill="#EDEDEA">AIP Logic</text>
    <text x="320" y="208" font-size="17" fill="#B8BBBF">extract notice lines</text>
    <rect x="300.5" y="300.5" width="220" height="90" fill="none" stroke="#2A2D31"/>
    <text x="320" y="340" font-size="22" font-weight="600" fill="#EDEDEA">Transforms</text>
    <text x="320" y="368" font-size="17" fill="#B8BBBF">clean + normalize</text>
    <rect x="300.5" y="460.5" width="220" height="90" fill="none" stroke="#2A2D31" stroke-dasharray="6 4"/>
    <text x="320" y="500" font-size="22" font-weight="600" fill="#EDEDEA">Decision logic</text>
    <text x="320" y="528" font-size="16" fill="#B8BBBF">impact, forecast, COAs</text>

    <!-- ontology -->
    <rect x="580.5" y="140.5" width="260" height="410" fill="#111316" stroke="#EDEDEA"/>
    <g font-size="19" fill="#EDEDEA">
      <text x="604" y="182">Program</text>
      <text x="604" y="218">Assembly</text>
      <text x="604" y="254">Part · BOM Line</text>
      <text x="604" y="290">Inventory Position</text>
      <text x="604" y="326">Notice · Notice Line</text>
      <text x="604" y="362">Impact Case</text>
      <text x="604" y="398">Review Flag</text>
      <text x="604" y="434">Course of Action</text>
      <text x="604" y="470" fill="#FF5B1F">Procurement Request</text>
      <text x="604" y="506" fill="#FF5B1F">Engineering Review</text>
    </g>

    <!-- app -->
    <rect x="890.5" y="140.5" width="254" height="110" fill="none" stroke="#EDEDEA"/>
    <text x="910" y="184" font-size="22" font-weight="600" fill="#EDEDEA">Workshop</text>
    <text x="910" y="212" font-size="17" fill="#B8BBBF">Dana's workspace: cases,</text>
    <text x="910" y="234" font-size="17" fill="#B8BBBF">forecast range, options</text>
    <rect x="890.5" y="360.5" width="254" height="110" fill="none" stroke="#FF5B1F"/>
    <text x="910" y="404" font-size="22" font-weight="600" fill="#EDEDEA">Action</text>
    <text x="910" y="432" font-size="17" fill="#B8BBBF">Approve course of action</text>
    <text x="910" y="454" font-size="17" fill="#FF5B1F">engineer decides</text>
  </g>

  <g stroke="#8B8F94" stroke-width="1.5" fill="none">
    <line x1="258" y1="185" x2="298" y2="185" marker-end="url(#arr)"/>
    <line x1="258" y1="345" x2="298" y2="345" marker-end="url(#arr)"/>
    <line x1="522" y1="185" x2="578" y2="185" marker-end="url(#arr)"/>
    <line x1="522" y1="345" x2="578" y2="345" marker-end="url(#arr)"/>
    <line x1="524" y1="480" x2="578" y2="480" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="842" y1="195" x2="888" y2="195" marker-end="url(#arr)"/>
    <line x1="1017" y1="252" x2="1017" y2="358" marker-end="url(#arr)"/>
  </g>
  <line x1="888" y1="420" x2="844" y2="420" stroke="#FF5B1F" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="866" y="408" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#FF5B1F">writes</text>
  <line x1="56" y1="598" x2="1144" y2="598" stroke="#2A2D31"/>
</svg>
